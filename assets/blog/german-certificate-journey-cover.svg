<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Illustration of five stairs rising towards a flag, labelled A1, A2, B1, B2 and C1, with clouds in a pale sky">
  <title>Stairs from A1 to C1</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9DCF2"/>
      <stop offset="0.65" stop-color="#E6EFF9"/>
      <stop offset="1" stop-color="#F7EFE6"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1470" cy="150" r="70" fill="#FFF6E6" opacity="0.9"/>
  <g fill="#FFFFFF" opacity="0.7">
    <path d="M110 250 a60 60 0 0 1 110 -20 a50 50 0 0 1 90 30 h-200 z"/>
    <path d="M900 190 a70 70 0 0 1 130 -25 a55 55 0 0 1 100 35 h-230 z"/>
  </g>
  <g transform="translate(0 -45)">
  <!-- stairs -->
  <g font-family="'Noto Sans','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="44" text-anchor="middle">
    <rect x="160" y="650" width="230" height="240" rx="10" fill="#9FB3CC"/>
    <rect x="390" y="560" width="230" height="330" rx="10" fill="#7F98B8"/>
    <rect x="620" y="470" width="230" height="420" rx="10" fill="#4E6E98"/>
    <rect x="850" y="380" width="230" height="510" rx="10" fill="#1E4C86"/>
    <rect x="1080" y="290" width="230" height="600" rx="10" fill="#04316A"/>
    <g fill="#FFFFFF">
      <text x="275" y="722">A1</text><text x="505" y="632">A2</text><text x="735" y="542">B1</text><text x="965" y="452">B2</text><text x="1195" y="362">C1</text>
    </g>
    <!-- step tops -->
    <g fill="#FFFFFF" opacity="0.55">
      <rect x="160" y="650" width="230" height="8" rx="4"/><rect x="390" y="560" width="230" height="8" rx="4"/><rect x="620" y="470" width="230" height="8" rx="4"/><rect x="850" y="380" width="230" height="8" rx="4"/><rect x="1080" y="290" width="230" height="8" rx="4"/>
    </g>
  </g>
  <!-- flag on the top step -->
  <path d="M1195 290 V170" stroke="#04316A" stroke-width="7" stroke-linecap="round"/>
  <path d="M1198 172 L1280 196 L1198 222 Z" fill="#E8B14A"/>
  </g>
  <!-- clouds in front -->
  <g transform="translate(0 40)"><g fill="#FFFFFF">
    <path d="M0 900 V820 a110 110 0 0 1 190 -50 a130 130 0 0 1 240 20 a100 100 0 0 1 170 40 a120 120 0 0 1 210 -10 a140 140 0 0 1 250 30 a110 110 0 0 1 200 -20 a120 120 0 0 1 200 20 a90 90 0 0 1 140 30 V900 Z"/>
  </g>
  <g fill="#FFFFFF" opacity="0.6">
    <path d="M0 800 a120 120 0 0 1 230 -40 a110 110 0 0 1 200 40 Z"/>
    <path d="M1150 810 a130 130 0 0 1 240 -40 a120 120 0 0 1 230 30 l80 10 Z"/>
  </g></g>
</svg>
